[graph]
all-features = true

# waiver-review-anchor: 2026-11-24
[advisories]
yanked = "deny"
# Explicit scope: the tool default moves from `all` to `workspace` in
# cargo-deny 0.22.0, which would silently stop reporting unmaintained
# transitive dependencies.
unmaintained = "all"
ignore = [
  "RUSTSEC-2026-0543", # chrono is unmaintained, all versions affected and no patched version; direct dependency of libre-ai-contract-types (crates/sdk-rs), no maintained drop-in; expires=2027-02-24; ref=https://rustsec.org/advisories/RUSTSEC-2026-0543
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
# Outbound workspace licences are governed by LICENSING.md; this allowlist is
# intentionally restricted to inbound dependencies.
private = { ignore = true }
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  # OSI-approved permissive licenses required by the pinned JSON Schema toolchain.
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["libre-ai"]

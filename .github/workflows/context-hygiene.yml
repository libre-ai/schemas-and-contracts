name: Context hygiene

on:
  push:
    branches: [main, migrate/recover-code]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Credential and personal-data checks remain in the composed root check.
# This separate guard covers tracked text machine paths and symlink targets;
# binary contents and historical private-identifier lists are not its scope.
jobs:
  context-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test context hygiene with synthetic Git fixtures
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check tracked text and symlink targets
        run: python3 -B .github/scripts/context_hygiene.py

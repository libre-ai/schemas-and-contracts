components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-libre_ai_session
    internalBiscuit:
      type: http
      scheme: bearer
      bearerFormat: Biscuit
  parameters:
    MissionId:
      name: missionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^urn:libre-ai:mission:[A-Za-z0-9._~-]+$"
        maxLength: 256
    IdempotencyKey:
